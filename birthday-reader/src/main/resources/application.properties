spring.application.name=birthday-reader

# RabbitMQ (override in environment)
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Default input file for scheduled run
app.excel.path=data/employees.xlsx

# Scheduler: run at 08:00 every day, Asia/Ho_Chi_Minh timezone
app.scheduler.cron=0 0 8 * * *
app.scheduler.timezone=Asia/Ho_Chi_Minh
