name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: docker.io
  DOCKER_USERNAME: anhhvq

jobs:
  # ----------------- 1: RUN UNIT TESTS -----------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [ birthday-reader, birthday-mailer ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Run tests for ${{ matrix.service }}
        run: mvn -f ${{ matrix.service }}/pom.xml clean test -q
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/

  # ----------------- 2: BUILD DOCKER IMAGES -----------------
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    strategy:
      matrix:
        service: [ birthday-reader, birthday-mailer ]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} 
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKER_USERNAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.DOCKER_USERNAME }}/${{ matrix.service }}:buildcache,mode=max
      
      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}

  # ----------------- 3: INTEGRATION TESTS -----------------
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    services:
      rabbitmq:
        image: rabbitmq:3.12-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672
          - 15672:15672
      
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 1807
          MYSQL_DATABASE: birthday_db
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Wait for MySQL and RabbitMQ
        run: |
          echo "Waiting for services to be healthy..."
          timeout 60s bash -c 'until echo > /dev/tcp/localhost/5672; do sleep 2; done' && echo "RabbitMQ is up!"
          timeout 60s bash -c 'until echo > /dev/tcp/localhost/3306; do sleep 2; done' && echo "MySQL is up!"
      
      - name: Build both services
        run: |
          mvn -f birthday-reader/pom.xml clean package -DskipTests
          mvn -f birthday-mailer/pom.xml clean package -DskipTests
      
      - name: Run integration tests
        env:
          SPRING_RABBITMQ_HOST: localhost
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/birthday_db
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: 1807
        run: |
          mvn -f birthday-reader/pom.xml test -q
          mvn -f birthday-mailer/pom.xml test -q

  # ----------------- 4: NOTIFY STATUS -----------------
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [ test, build, integration-test ]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          # Kiểm tra xem có bất kỳ job nào thực sự bị thất bại (failure) hay không
          if [ "${{ needs.test.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "failure" ] || [ "${{ needs.integration-test.result }}" = "failure" ]; then
            echo "::error::CI/CD Pipeline failed! Check logs for details."
            exit 1
          fi
          
          # Đưa ra thông báo linh hoạt dựa vào việc các job sau có chạy hay không
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "::notice::✓ Toàn bộ quá trình Tests và Build thành công, Docker image đã đồng bộ lên Hub!"
          else
            echo "::notice::✓ PR Checks hoàn tất: Unit Tests của các service đều vượt qua!"
          fi