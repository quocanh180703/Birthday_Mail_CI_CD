name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.actor == 'dependabot'
    
    steps:
      # 1. THÊM BƯỚC NÀY: Khởi tạo Git repository để tránh lỗi "not a git repository"
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. CẬP NHẬT: Lên v2 để hết cảnh báo Node.js 20 bị deprecated
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      
      - name: Auto-merge Dependabot PRs
        run: |
          gh pr merge --squash --auto "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}