version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: birthday-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  reader:
    build:
      context: ./birthday-reader
    container_name: birthday-reader
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SERVER_PORT: 8080
    volumes:
      - ./birthday-reader/data:/app/data
    depends_on:
      - rabbitmq

  mailer:
    build:
      context: ./birthday-mailer
    container_name: birthday-mailer
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SERVER_PORT: 8081
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: hoangvuongquocanh76@gmail.com
      SPRING_MAIL_PASSWORD: cwbgqntxuloetydr
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      # MySQL datasource (overrides application.properties)
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mail_record?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 180703
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - rabbitmq
      - mysql

  mysql:
    image: mysql:8.0
    container_name: birthday-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 180703
      MYSQL_DATABASE: mail_record
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
